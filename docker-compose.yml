
services:

  # ---------------------------------------------------------------------------
  # 1. Base de Datos Central (PostgreSQL)
  # Usada por MLflow (tracking/registry) y FastAPI (log de inferencias para Power BI)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aluar_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops_password}
      POSTGRES_DB: ${POSTGRES_DB:-mlops_db}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops_user} -d ${POSTGRES_DB:-mlops_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Data Lake Local (MinIO)
  # Reemplazo On-Premise de AWS S3 para guardar artefactos de MLflow y datasets
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: aluar_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola Web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Servicio auxiliar para crear automáticamente el bucket 'mlflow' al arrancar MinIO
  create_buckets:
    image: minio/mc:latest
    container_name: aluar_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-admin12345};
      /usr/bin/mc mb myminio/mlflow --ignore-existing;
      exit 0;
      "

  # ---------------------------------------------------------------------------
  # 3. Experiment Tracking & Model Registry (MLflow)
  # Conecta a Postgres (Metadatos) y MinIO (Artefactos/Pesos .pt, .onnx)
  # ---------------------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.10.2
    container_name: aluar_mlflow
    restart: always
    ports:
      - "5001:5000"
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-admin12345}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-mlops_user}:${POSTGRES_PASSWORD:-mlops_password}@postgres:5432/${POSTGRES_DB:-mlops_db}
      --default-artifact-root s3://mlflow/
      --host 0.0.0.0
      --port 5000
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 4. Servidor de Inferencia / API (FastAPI)
  # Recibe imágenes/frames, ejecuta YOLO y persiste resultados en Postgres
  # ---------------------------------------------------------------------------
  inference_api:
    build:
      context: ./src_api
      dockerfile: Dockerfile
    container_name: aluar_inference_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-mlops_user}:${POSTGRES_PASSWORD:-mlops_password}@postgres:5432/${POSTGRES_DB:-mlops_db}
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-admin12345}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    volumes:
      - ./src_api:/app
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_started

volumes:
  postgres_data:
  minio_data: